<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CENPB (P07199) Charge-Colored Structure Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.1.0/3Dmol-min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f7fafc; color: #111827; }
    .wrap { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
    h1 { margin-bottom: 4px; font-size: 1.4rem; }
    .muted { color: #4b5563; font-size: 13px; margin: 0 0 10px; }
    code { background: #eef2ff; padding: 2px 5px; border-radius: 4px; font-size: 12px; }

    /* Legend */
    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0 12px; font-size: 13px; }
    .dot { width: 12px; height: 12px; border-radius: 999px; display: inline-block;
           margin-right: 5px; vertical-align: middle; }

    /* Controls bar */
    .controls {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      margin-bottom: 10px;
    }
    .controls button {
      padding: 6px 14px; border: 1px solid #d1d5db; border-radius: 6px;
      background: #fff; cursor: pointer; font-size: 13px; color: #374151;
      transition: background 0.15s;
    }
    .controls button:hover { background: #f3f4f6; }
    .controls button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .hint { font-size: 12px; color: #6b7280; margin-left: 4px; }

    /* Style selector */
    .controls select {
      padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px;
      background: #fff; font-size: 13px; color: #374151; cursor: pointer;
    }

    /* Viewer */
    #viewer {
      width: 100%; height: 70vh; min-height: 480px;
      border: 1px solid #d1d5db; border-radius: 10px;
      background: white; position: relative;
    }

    /* Loading overlay */
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: rgba(255,255,255,0.92);
      border-radius: 10px; z-index: 10; gap: 12px;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #e5e7eb;
      border-top-color: #2563eb; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #6b7280; font-size: 14px; margin: 0; }

    /* Error */
    #error-msg {
      display: none; padding: 20px; color: #991b1b;
      background: #fef2f2; border-radius: 8px; margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CENPB structure model colored by residue charge</h1>
    <p class="muted">Model source: AlphaFold DB &mdash; UniProt <code>P07199</code></p>

    <div class="legend">
      <span><span class="dot" style="background:#2563eb"></span>Positive (Lys, Arg, His)</span>
      <span><span class="dot" style="background:#dc2626"></span>Negative (Asp, Glu)</span>
      <span><span class="dot" style="background:#9ca3af"></span>Neutral / other</span>
    </div>

    <div class="controls">
      <button id="btn-spin">&#9654; Spin</button>
      <button id="btn-reset">&#8635; Reset view</button>
      <button id="btn-zoom-in">+ Zoom in</button>
      <button id="btn-zoom-out">&minus; Zoom out</button>
      <select id="style-select" title="Representation style">
        <option value="cartoon">Cartoon</option>
        <option value="stick">Stick</option>
        <option value="sphere">Sphere (CPK)</option>
        <option value="surface">Surface</option>
      </select>
      <span class="hint">&#x1F5B1; Drag to rotate &nbsp;|&nbsp; Scroll to zoom &nbsp;|&nbsp; Right-drag to pan</span>
    </div>

    <div style="position:relative;">
      <div id="viewer">
        <div id="loading">
          <div class="spinner"></div>
          <p>Loading AlphaFold model&hellip;</p>
        </div>
      </div>
    </div>
    <div id="error-msg"></div>
  </div>

  <script>
    const PDB_URL = "https://alphafold.ebi.ac.uk/files/AF-P07199-F1-model_v4.pdb";

    // ── Viewer setup ──────────────────────────────────────────────────────────
    const viewerEl = document.getElementById("viewer");
    const viewer = $3Dmol.createViewer(viewerEl, {
      backgroundColor: "white",
      antialias: true,
    });

    // Colour scheme (applied after any style change)
    function applyColoring() {
      // 1. Base colour for all residues
      viewer.setStyle({}, { cartoon: { color: "#9ca3af", opacity: 0.92 } });

      // FIX: use 'or' selector instead of array in 'resn' — avoids "invalid name" error
      // Positive residues → blue
      viewer.setStyle(
        { or: [{ resn: "LYS" }, { resn: "ARG" }, { resn: "HIS" }] },
        { cartoon: { color: "#2563eb" } }
      );
      // Negative residues → red
      viewer.setStyle(
        { or: [{ resn: "ASP" }, { resn: "GLU" }] },
        { cartoon: { color: "#dc2626" } }
      );
    }

    // Apply the current representation (cartoon / stick / sphere / surface)
    function applyRepresentation(rep) {
      viewer.setStyle({}, {}); // clear all

      if (rep === "cartoon") {
        applyColoring();
      } else if (rep === "stick") {
        viewer.setStyle({}, { stick: { colorscheme: "Jmol" } });
      } else if (rep === "sphere") {
        viewer.setStyle({}, { sphere: { colorscheme: "Jmol", scale: 0.4 } });
      } else if (rep === "surface") {
        viewer.setStyle({}, { cartoon: { color: "#9ca3af", opacity: 0.3 } });
        viewer.addSurface($3Dmol.SurfaceType.VDW, { opacity: 0.75, colorscheme: "Jmol" });
      }
      viewer.render();
    }

    // ── Fetch & load PDB ─────────────────────────────────────────────────────
    fetch(PDB_URL)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status} — could not fetch model`);
        return r.text();
      })
      .then(pdbData => {
        viewer.addModel(pdbData, "pdb");
        applyColoring();
        viewer.zoomTo();
        viewer.render();

        // Hide loading overlay
        document.getElementById("loading").style.display = "none";
      })
      .catch(err => {
        document.getElementById("loading").style.display = "none";
        const msg = document.getElementById("error-msg");
        msg.style.display = "block";
        msg.innerHTML =
          `<strong>Failed to load model.</strong><br>URL: <code>${PDB_URL}</code><br>${err.message}`;
      });

    // ── Controls ──────────────────────────────────────────────────────────────
    let spinning = false;

    document.getElementById("btn-spin").addEventListener("click", function () {
      spinning = !spinning;
      viewer.spin(spinning);
      this.classList.toggle("active", spinning);
      this.textContent = spinning ? "⏹ Stop spin" : "▶ Spin";
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      viewer.zoomTo();
      viewer.render();
    });

    document.getElementById("btn-zoom-in").addEventListener("click", () => {
      viewer.zoom(1.25, 400);
    });

    document.getElementById("btn-zoom-out").addEventListener("click", () => {
      viewer.zoom(0.8, 400);
    });

    document.getElementById("style-select").addEventListener("change", function () {
      applyRepresentation(this.value);
    });
  </script>
</body>
</html>
